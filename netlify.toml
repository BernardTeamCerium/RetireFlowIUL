[build]
  publish = "public"
  functions = "netlify/functions"
  # No build step needed; the site is plain HTML/CSS/JS.

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/guide/*.pdf"
  [headers.values]
    Content-Disposition = "attachment; filename=\"RetireFlow-IUL-Retirement-Playbook.pdf\""
